plugins {
    alias(libs.plugins.android.application)
}
def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace 'org.koreader.backgroundonyxsynckoreader'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    // Release signing is only configured when a keystore is provided (CI secrets or
    // local.properties), so debug builds work without it.
    def keystoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProperties["KEYSTORE_FILE"]
    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties["KEYSTORE_PASSWORD"]
                keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties["KEY_ALIAS"]
                keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties["KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    defaultConfig {
        applicationId "org.koreader.backgroundonyxsynckoreader"
        minSdk 24
        targetSdk 33
        versionCode 6
        versionName "6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '36.1.0'
}

dependencies {
    implementation libs.core
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}