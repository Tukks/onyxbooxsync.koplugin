name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check versions
        run: |
          meta_version=$(sed -n 's/^ *version *= *"\(v[^"]*\)".*/\1/p' _meta.lua)
          # Beta tags (v1.2.3-beta.1) are checked against their base version
          if [ "${GITHUB_REF_NAME%%-*}" != "$meta_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match _meta.lua version '$meta_version'"
            exit 1
          fi
          min_code=$(sed -n 's/^local MIN_VERSION_CODE *= *\([0-9]*\).*/\1/p' main.lua)
          version_code=$(sed -n 's/^ *versionCode *\([0-9]*\).*/\1/p' android/app/build.gradle)
          if [ -z "$min_code" ] || [ -z "$version_code" ] || [ "$min_code" -gt "$version_code" ]; then
            echo "::error::MIN_VERSION_CODE ($min_code) in main.lua must be <= versionCode ($version_code) in build.gradle"
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Verify APK exists
        run: ls android/app/build/outputs/apk/release/

      - name: Prepare artifacts
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/onyx-sync.apk
          cp main.lua release/
          cp _meta.lua release/
          mkdir onyxbooxsync.koplugin
          cp main.lua onyxbooxsync.koplugin/
          cp _meta.lua onyxbooxsync.koplugin/
          zip -r release/onyxbooxsync.koplugin.zip onyxbooxsync.koplugin/

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*